name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pywebview pyinstaller
      - name: Build exe
        run: pyinstaller budget.spec
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 가계부-Windows
          path: dist/가계부.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pywebview pyinstaller
      - name: Build app
        run: pyinstaller budget.spec
      - name: Zip app
        run: cd dist && zip -r 가계부-Mac.zip 가계부.app
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 가계부-Mac
          path: dist/가계부-Mac.zip
