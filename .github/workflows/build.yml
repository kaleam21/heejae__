name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pywebview pyinstaller

      - name: Build budget.exe
        run: pyinstaller budget.spec

      - name: Build updater.exe
        run: pyinstaller --onefile --noconsole --name updater updater.py

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Get version from main.py
        id: version
        run: |
          $v = (Select-String -Path main.py -Pattern 'CURRENT_VERSION = "(.+)"').Matches[0].Groups[1].Value
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Update NSIS version
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          (Get-Content installer.nsi) -replace '!define APP_VERSION ".*"', "!define APP_VERSION `"$ver`"" | Set-Content installer.nsi

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 가계부-Windows
          path: |
            dist/budget.exe
            dist/updater.exe
            BudgetApp_Setup_v${{ steps.version.outputs.VERSION }}.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pywebview pyinstaller

      - name: Build app
        run: pyinstaller budget.spec

      - name: Zip app
        run: cd dist && zip -r BudgetApp-Mac.zip 가계부.app

      - name: Upload Mac
        uses: actions/upload-artifact@v4
        with:
          name: 가계부-Mac
          path: dist/BudgetApp-Mac.zip
